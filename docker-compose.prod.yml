services:
  db:
    image: postgres:16-alpine
    container_name: server-monitor_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-server-monitor}
      POSTGRES_USER: ${DATABASE_USER:-server-monitor}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-server-monitor}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: ghcr.io/tuyencaovn/saasguard.tech/backend:latest
    container_name: server-monitor_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BIND_HOST:-127.0.0.1}:${API_PORT:-3005}:3005"
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3005
      DATABASE_HOST: db
      DATABASE_PORT: 5432
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/hostfs:ro
      # Mount host PM2 home at the SAME path inside the container so the pm2
      # client (which reads PM2_HOME from .env) finds the socket where it looks.
      - ${PM2_HOME:-/root/.pm2}:${PM2_HOME:-/root/.pm2}
    user: root
    pid: host
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3005/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    image: ghcr.io/tuyencaovn/saasguard.tech/frontend:latest
    container_name: server-monitor_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${BIND_HOST:-127.0.0.1}:${DASH_PORT:-3006}:3006"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3006/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pg_data:
    driver: local
